# compose 专用后端配置：地址全部指向 compose 服务名。
# 用法：复制为 service/manifest/config/config.docker.yaml（compose.yaml 已挂载该路径）。
# 本文件可入库（无真实密码，密码走同目录 .env）。

server:
  address: ":8080"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

database:
  default:
    link: "pgsql:postgres:postgres123@tcp(postgres:5432)/todo-agent?TimeZone=Asia/Shanghai"

redis:
  default:
    address: "redis:6379"
    pass: "redis123"
    db: 0

jwt:
  key: "todo-agent-change-me-in-production"
  expire: 86400

elasticsearch:
  addresses:
    - "http://elasticsearch:9200"
  username: "elastic"
  password: ""

modelKey:
  # KEK 走库（设置页配置）；留空则强制要求环境变量 MODEL_KEY_ENC_KEY。
  encKey: ""
