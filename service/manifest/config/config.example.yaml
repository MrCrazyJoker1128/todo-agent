# 模型 Key 加密配置示例（复制为 config.yaml 后按需修改）。
# KEK 来源优先级：环境变量 MODEL_KEY_ENC_KEY > 本项 modelKey.encKey。
# 要求：32 字节原文 / base64(32字节) / hex(32字节) 均可；
# 其他任意口令经 SHA-256 派生（安全性低于真随机 32 字节）。
# 生产环境 MUST 用环境变量注入，不要把真实 KEK 写进文件入库。
server:
  address: ":8080"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

database:
  default:
    link: "pgsql:postgres:YOUR_PASSWORD@tcp(127.0.0.1:5432)/todo-agent?TimeZone=Asia/Shanghai"
# 格式：pgsql:用户名:密码@tcp(主机:端口)/库名；改完复制为同目录 config.yaml

redis:
  default:
    host: "127.0.0.1"
    port: 6379
    pass: ""
    db: 0

jwt:
  key: "todo-agent"
  expire: 86400

elasticsearch:
  addresses:
    - "http://127.0.0.1:9200"
  username: "elastic"
  password: ""

modelKey:
  # 留空则强制要求环境变量 MODEL_KEY_ENC_KEY。
  encKey: ""
